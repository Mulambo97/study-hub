<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Data Engineering Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a study notebook. Sticky tab bar, one column of content at ~70ch, schema-grid paper behind. */
:root {
  --paper: #f3f5f8;
  --sheet: #ffffff;
  --ink: #18202e;
  --muted: #5a6577;
  --rule: #d9dee7;
  --accent: #2348c7;
  --accent-soft: #e4eafb;
  --mark: #f2b13a;
  --mark-soft: #fdf1d8;
  --good: #1d7a4c;
  --good-soft: #def2e7;
  --bad: #b3372c;
  --bad-soft: #f8e1de;
  --code-bg: #eef1f6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --sheet: #171c27; --ink: #e5e9f1; --muted: #98a2b5; --rule: #2a3242;
    --accent: #8ea6ff; --accent-soft: #1f2a4d; --mark: #f2b13a; --mark-soft: #3a2e14;
    --good: #5fd39a; --good-soft: #15352a; --bad: #ff8a7d; --bad-soft: #3d1d1a; --code-bg: #0e121a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --sheet: #171c27; --ink: #e5e9f1; --muted: #98a2b5; --rule: #2a3242;
  --accent: #8ea6ff; --accent-soft: #1f2a4d; --mark: #f2b13a; --mark-soft: #3a2e14;
  --good: #5fd39a; --good-soft: #15352a; --bad: #ff8a7d; --bad-soft: #3d1d1a; --code-bg: #0e121a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  margin: 0;
}
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
header.top { padding-block: 28px 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 .q { color: var(--accent); font-family: var(--mono); font-weight: 500; font-size: 0.55em; display: block; letter-spacing: 0; margin-bottom: 6px; }
.sync { font-family: var(--mono); font-size: 12px; color: var(--muted); }
nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--rule);
  display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none;
}
nav.tabs button {
  font: 500 14px var(--body); color: var(--muted); background: transparent; border: 0;
  padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--sheet); box-shadow: inset 0 -2px 0 var(--accent); }
nav.tabs .count { font-family: var(--mono); font-size: 11px; background: var(--mark); color: #2a1d00; border-radius: 9px; padding: 1px 6px; margin-left: 4px; }
main { display: grid; gap: 20px; padding-top: 20px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 600; margin: 18px 0 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
ul, ol { margin: 0 0 10px; padding-left: 22px; }
li { margin-bottom: 4px; }
a { color: var(--accent); text-underline-offset: 2px; }
code, pre { font-family: var(--mono); font-size: 13.5px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 8px 0 12px; line-height: 1.45; white-space: pre; }
.btn {
  font: 500 14px var(--body); border-radius: 7px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, nav.tabs button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea, input[type="text"], input[type="date"], select {
  width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 7px; padding: 10px 12px;
}
input[type="date"], select { width: auto; }
textarea { min-height: 110px; resize: vertical; font-family: var(--mono); font-size: 14px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.steps li:last-child { border-bottom: 0; }
.steps input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.steps .t { font-weight: 500; }
.steps .d { color: var(--muted); font-size: 14px; }
.steps .min { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.steps li.done .t { text-decoration: line-through; color: var(--muted); }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.mark { background: var(--mark-soft); color: var(--ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.callout { border-left: 3px solid var(--mark); background: var(--mark-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; }
.weeks { display: grid; gap: 10px; }
details.week { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
details.week > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
details.week > summary::-webkit-details-marker { display: none; }
details.week[open] > summary { border-bottom: 1px solid var(--rule); }
.wk { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.wk b { display: block; font-family: var(--display); font-size: 1.5rem; color: var(--ink); line-height: 1; }
.wtitle { font-weight: 600; }
.wgoal { font-size: 14px; color: var(--muted); }
.bar { width: 64px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.week-body { padding: 4px 18px 18px; min-width: 0; }
details.week.current { border-color: var(--accent); }
.res { list-style: none; padding: 0; display: grid; gap: 6px; }
.res li { margin: 0; }
.res .why { color: var(--muted); font-size: 14px; }
.card {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 22px;
  display: grid; gap: 14px; min-height: 240px;
}
.card .front { font-size: 1.15rem; font-weight: 500; }
.card .back { border-top: 1px dashed var(--rule); padding-top: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-size: 1.1rem; }
.boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.boxes div { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.boxes div b { display: block; font-size: 1.1rem; color: var(--ink); }
.prob { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 16px; display: grid; gap: 10px; min-width: 0; }
.prob:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.hint { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.answer { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.answer pre { background: var(--sheet); }
.gap { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.gap.fixed .gt { text-decoration: line-through; color: var(--muted); }
.gt { min-width: 0; overflow-wrap: anywhere; }
.topicbars { display: grid; gap: 6px; margin: 8px 0 14px; }
.topicbars div { display: grid; grid-template-columns: 110px 1fr 28px; gap: 10px; align-items: center; font-size: 14px; }
.topicbars span.b { height: 8px; background: var(--bad); border-radius: 4px; opacity: 0.75; }
.topicbars em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.methods div { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; background: var(--paper); }
.methods b { display: block; margin-bottom: 2px; }
.methods span { font-size: 14px; color: var(--muted); }
.skilltbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.skilltbl th, .skilltbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.skilltbl th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.scroll { overflow-x: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
@media (max-width: 520px) {
  .sheet { padding: 16px; }
  details.week > summary { grid-template-columns: 42px 1fr; }
  details.week > summary .bar { display: none; }
  .boxes { grid-template-columns: repeat(3, 1fr); }
  .topicbars div { grid-template-columns: 86px 1fr 24px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1><span class="q">SELECT skill FROM resume WHERE can_defend = true;</span>Data Engineering Study Hub</h1>
    <div class="sync" id="sync">Saved in this browser</div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="plan" aria-selected="false">12-week plan</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button role="tab" data-tab="cards" aria-selected="false">Flashcards<span class="count" id="dueCount" hidden>0</span></button>
    <button role="tab" data-tab="gaps" aria-selected="false">Gaps<span class="count" id="gapCount" hidden>0</span></button>
    <button role="tab" data-tab="skills" aria-selected="false">Resume check</button>
    <button role="tab" data-tab="setup" aria-selected="false">Tools &amp; data</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- Content ---------------- */
const TOPICS = ["SQL","Python","pandas","ETL","Modeling","Spark","Airflow","Docker","AWS","CI/CD","dbt/BI","Behavioral"];

const WEEKS = [
 { n:1, title:"SQL foundations", goal:"Write joins and aggregates without looking anything up.",
   ideas:["A query runs in this order: FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. That is why you can't use a SELECT alias in WHERE.",
     "INNER JOIN keeps matching rows only. LEFT JOIN keeps every left row and fills NULLs when nothing matches.",
     "WHERE filters rows before grouping; HAVING filters groups after grouping.",
     "COUNT(*) counts rows; COUNT(col) skips NULLs; COUNT(DISTINCT col) counts unique values.",
     "A join on a non-unique key multiplies rows. Always ask: what is one row of the result?"],
   tasks:["SQLBolt lessons 1–12","Load the practice database into DB Fiddle (Tools & data tab)","Practice problems for week 1","LeetCode SQL 50: the Select and Basic Joins sections","Write a Feynman note: LEFT JOIN vs INNER JOIN"],
   res:[["SQLBolt","https://sqlbolt.com/","Short interactive lessons in the browser"],["Mode SQL tutorial","https://mode.com/sql-tutorial/","Clear explanations of each clause"],["LeetCode SQL 50","https://leetcode.com/studyplan/top-sql-50/","The standard interview problem set"],["PostgreSQL Exercises","https://pgexercises.com/","Free graded exercises on one schema"]],
   feynman:"Explain to a friend who doesn't code why a LEFT JOIN can return more rows than the left table has.",
   resume:"Pick a resume bullet that involved data. Which two tables would you have joined, and on what key?" },
 { n:2, title:"SQL: subqueries, CTEs, CASE", goal:"Break a hard question into named steps with CTEs.",
   ideas:["A CTE (WITH name AS (...)) is a named subquery. Use it to make each step readable.",
     "Correlated subqueries run once per outer row; a JOIN or window function is often faster.",
     "CASE WHEN turns conditions into values — useful for bucketing and conditional sums: SUM(CASE WHEN ... THEN amount ELSE 0 END).",
     "NULL is not equal to anything, not even NULL. Use IS NULL and COALESCE(col, default).",
     "IN / EXISTS for membership; NOT EXISTS is safer than NOT IN when NULLs are possible."],
   tasks:["Mode SQL: Intermediate section","Practice problems for weeks 1–2 (mixed)","DataLemur: 5 Easy questions","Kaggle Learn: Python course, lessons 1–3","Feynman note: what a CTE is and when to use one"],
   res:[["DataLemur SQL questions","https://datalemur.com/questions","Real interview questions by company"],["PostgreSQL tutorial: CTE","https://www.postgresqltutorial.com/postgresql-tutorial/postgresql-cte/","Worked examples"],["Kaggle Learn: Python","https://www.kaggle.com/learn/python","Free, runs in the browser"]],
   feynman:"Explain why NOT IN can return zero rows when the subquery contains a NULL.",
   resume:"Think of a report you produced. Write it as a CTE pipeline: step 1, step 2, final SELECT." },
 { n:3, title:"Window functions + pandas start", goal:"Solve DataLemur Medium SQL; load and inspect data in pandas.",
   ideas:["Window functions compute across related rows without collapsing them: func() OVER (PARTITION BY ... ORDER BY ...).",
     "ROW_NUMBER gives 1,2,3; RANK gives 1,1,3; DENSE_RANK gives 1,1,2.",
     "LAG/LEAD read the previous/next row — for day-over-day changes and gaps between events.",
     "SUM(x) OVER (PARTITION BY k ORDER BY d) is a running total.",
     "In pandas, a DataFrame is a table; df.info(), df.head(), df.describe() are your first three commands on any dataset."],
   tasks:["PostgreSQL window-function tutorial page","Practice problems: window functions","DataLemur: 3 Medium questions","Kaggle Learn: Pandas, lessons 1–3","Feynman note: RANK vs DENSE_RANK vs ROW_NUMBER"],
   res:[["PostgreSQL docs: window functions","https://www.postgresql.org/docs/current/tutorial-window.html","The official tutorial page, short"],["Kaggle Learn: Pandas","https://www.kaggle.com/learn/pandas","Hands-on, free"],["pandas: 10 minutes to pandas","https://pandas.pydata.org/docs/user_guide/10min.html","Official quick tour"],["Google Colab","https://colab.research.google.com/","Run Python with nothing installed"]],
   feynman:"Explain the difference between GROUP BY and PARTITION BY without using either word.",
   resume:"Where in your past work would 'top N per group' or 'change since last period' have come up?" },
 { n:4, title:"pandas cleaning + ETL concepts", goal:"Clean a messy dataset end to end and describe an ETL job.",
   ideas:["Cleaning checklist: types (to_datetime, to_numeric), duplicates, missing values, inconsistent text (strip/lower), outliers.",
     "merge() is a SQL join: how='left'/'inner', on=key. Check row counts before and after.",
     "groupby().agg() is GROUP BY. Use named aggregations for readable output.",
     "ETL = extract (pull from source) → transform (clean, join, aggregate) → load (write to target). ELT loads raw first and transforms inside the warehouse.",
     "A good pipeline is idempotent: running it twice gives the same result, not double rows."],
   tasks:["Kaggle Learn: Data Cleaning course","Clean the messy CSV (Tools & data tab) in Colab","Practice problems: pandas + ETL (mixed with SQL)","Watch Data Engineering Zoomcamp module 1 intro","Feynman note: what idempotent means and why pipelines need it"],
   res:[["Kaggle Learn: Data Cleaning","https://www.kaggle.com/learn/data-cleaning","Missing values, parsing dates, encodings"],["pandas user guide: merge","https://pandas.pydata.org/docs/user_guide/merging.html","Official reference with diagrams"],["Data Engineering Zoomcamp","https://github.com/DataTalksClub/data-engineering-zoomcamp","Free full course: Docker, Postgres, orchestration, Spark, dbt"]],
   feynman:"Explain ETL using a kitchen: what is extract, transform and load when cooking dinner?",
   resume:"Describe one data flow from your resume as extract → transform → load. Where did it come from and where did it go?" },
 { n:5, title:"Mini pipeline into PostgreSQL", goal:"A working project on GitHub that you can explain line by line.",
   ideas:["Pipeline shape: extract.py (download raw file) → transform.py (pandas clean) → load.py (write to Postgres).",
     "Load with SQLAlchemy + df.to_sql, or psycopg COPY for speed.",
     "Make loads idempotent: delete-then-insert for a date partition, or INSERT ... ON CONFLICT DO UPDATE (upsert).",
     "Add data-quality checks: row counts, no NULL keys, values in range. Fail loudly when a check fails.",
     "Keep config (paths, connection strings) out of code: environment variables or a .env file not committed to Git."],
   tasks:["Pick the dataset: NYC taxi trips (one month)","Write extract, transform and load steps yourself","Add 3 data-quality checks","Push to GitHub with a README you wrote","Practice problems: mixed set"],
   res:[["NYC TLC trip record data","https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page","The dataset for the project"],["Zoomcamp module 1: Docker + Postgres","https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/01-docker-terraform","Ingesting taxi data into Postgres step by step"],["PostgreSQL: INSERT ON CONFLICT","https://www.postgresql.org/docs/current/sql-insert.html","Upsert syntax"]],
   feynman:"Explain what happens if your pipeline crashes halfway through the load, and how you made re-running safe.",
   resume:"Your resume says you built or ran ETL. Compare that pipeline with this one: what was the same, what was bigger?" },
 { n:6, title:"Data modeling", goal:"Design and defend a star schema for your project.",
   ideas:["Start every model by stating the grain: what is one row of the fact table? (e.g. one taxi trip).",
     "Fact tables hold measures (amount, distance) and foreign keys. Dimension tables hold descriptions (date, zone, vendor).",
     "Star schema = facts + denormalized dims; snowflake = dims normalized further. Star is simpler to query.",
     "Normalization (3NF) removes duplication for OLTP writes; analytics denormalizes for fast reads.",
     "Slowly changing dimensions: Type 1 overwrite, Type 2 add a new row with valid_from / valid_to / is_current."],
   tasks:["Read Kimball dimensional-modeling techniques (first 6 topics)","Draw your star schema: fact_trips + 3–4 dims","Create the tables in Postgres and load them","Practice problems: modeling (mixed)","Feynman note: fact vs dimension"],
   res:[["Kimball: dimensional modeling techniques","https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/","The source most interviewers learned from"],["dbt guide: building a Kimball model","https://docs.getdbt.com/blog/kimball-dimensional-model","Modern walk-through with SQL"],["dbdiagram.io","https://dbdiagram.io/","Draw your schema for free"]],
   feynman:"Explain why an analytics warehouse repeats data that a normal app database would never repeat.",
   resume:"Clayco-, CSUN- and EAB-style interviews ask about modeling. Sketch the model behind one report you made." },
 { n:7, title:"Apache Spark (PySpark)", goal:"Rebuild your pipeline's transform step in PySpark and explain why Spark exists.",
   ideas:["Spark splits data into partitions and processes them in parallel across executors. pandas runs on one machine in memory.",
     "Transformations (select, filter, groupBy) are lazy; nothing runs until an action (count, show, write).",
     "Narrow transformations (filter, map) stay in a partition; wide ones (groupBy, join) shuffle data across the network — the slow part.",
     "Broadcast a small table in a join to avoid a shuffle: F.broadcast(dim).",
     "Write Parquet: columnar, compressed, keeps types. Partition output by a column you filter on (e.g. date)."],
   tasks:["PySpark DataFrame quickstart","Zoomcamp module 5 (batch / Spark) videos","Rewrite transform.py as transform_spark.py","Practice problems: Spark (mixed)","Feynman note: lazy evaluation"],
   res:[["PySpark quickstart: DataFrame","https://spark.apache.org/docs/latest/api/python/getting_started/quickstart_df.html","Official, runnable in Colab"],["Zoomcamp module 5: batch","https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/05-batch","Spark with the same taxi data"],["Spark SQL guide","https://spark.apache.org/docs/latest/sql-programming-guide.html","Reference"]],
   feynman:"Explain a shuffle using a classroom: 30 students each hold cards and must group them by color.",
   resume:"Your first ITOT bullet mentions Spark. What data size, what job, what did Spark do there that pandas couldn't?" },
 { n:8, title:"Airflow", goal:"Your pipeline runs daily as an Airflow DAG.",
   ideas:["A DAG is a set of tasks with dependencies and no cycles: extract >> transform >> load.",
     "The scheduler starts DAG runs on a schedule; each run has a logical date (the data interval it processes).",
     "Tasks should be idempotent and use the logical date, so backfills and retries are safe.",
     "Retries, retry_delay and alerting on failure are set per task or in default_args.",
     "Airflow orchestrates; it should not do heavy processing itself. Push work to Spark, SQL or a container."],
   tasks:["Airflow fundamentals tutorial","Astronomer Academy: Airflow 101 (free)","Write dags/taxi_pipeline.py","Run a backfill for 3 past days","Practice problems: Airflow (mixed)"],
   res:[["Airflow tutorial: fundamentals","https://airflow.apache.org/docs/apache-airflow/stable/tutorial/fundamentals.html","Official first DAG"],["Astronomer Academy","https://academy.astronomer.io/","Free Airflow courses"],["Airflow: TaskFlow API","https://airflow.apache.org/docs/apache-airflow/stable/tutorial/taskflow.html","Modern way to write DAGs"]],

const CARDS = [
 ["c1",1,"SQL","In what order does SQL logically run the clauses of a SELECT?","FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT."],
 ["c2",1,"SQL","WHERE vs HAVING?","WHERE filters rows before grouping. HAVING filters groups after aggregation (can use SUM, COUNT…)."],
 ["c3",1,"SQL","What does a LEFT JOIN return?","Every row from the left table, plus matching right rows; NULLs on the right where nothing matches."],
 ["c4",1,"SQL","COUNT(*) vs COUNT(col) vs COUNT(DISTINCT col)?","All rows / non-NULL values of col / unique non-NULL values of col."],
 ["c5",1,"SQL","How do you find rows in A with no match in B?","LEFT JOIN B ... WHERE B.key IS NULL (or NOT EXISTS)."],
 ["c6",1,"SQL","Why can a join return more rows than either table?","If the join key isn't unique on one side, each match multiplies rows (fan-out)."],
 ["c7",2,"SQL","What is a CTE?","A named temporary result defined with WITH name AS (...), used like a table in the next query. Makes multi-step logic readable."],
 ["c8",2,"SQL","Why can NOT IN return no rows?","If the subquery contains a NULL, x NOT IN (...) is never TRUE. Use NOT EXISTS instead."],
 ["c9",2,"SQL","How do you replace NULL with a default value?","COALESCE(col, default) — returns the first non-NULL argument."],
 ["c10",2,"SQL","How do you do a conditional count or sum?","SUM(CASE WHEN condition THEN 1 ELSE 0 END), or COUNT(*) FILTER (WHERE condition) in Postgres."],
 ["c11",2,"SQL","Correlated subquery?","A subquery that references the outer row, so it runs once per outer row. Often replaceable with a join or window function."],
 ["c12",3,"SQL","ROW_NUMBER vs RANK vs DENSE_RANK on ties (100,100,90)?","ROW_NUMBER 1,2,3 · RANK 1,1,3 · DENSE_RANK 1,1,2."],
 ["c13",3,"SQL","What does PARTITION BY do in a window function?","Splits rows into groups; the function restarts in each group. Rows are NOT collapsed (unlike GROUP BY)."],
 ["c14",3,"SQL","What do LAG and LEAD do?","Read a value from the previous (LAG) or next (LEAD) row in the window's order."],
 ["c15",3,"SQL","How do you write a running total?","SUM(amount) OVER (PARTITION BY customer ORDER BY date)."],
 ["c16",3,"SQL","How do you get the top 3 per group?","ROW_NUMBER() OVER (PARTITION BY group ORDER BY value DESC) in a CTE, then WHERE rn <= 3."],
 ["c17",3,"pandas","First three things to run on a new DataFrame?","df.head(), df.info() (types, nulls), df.describe() (numeric ranges)."],
 ["c18",3,"pandas","How do you read a CSV and parse a date column?","pd.read_csv('f.csv', parse_dates=['col']) or pd.to_datetime(df['col'], errors='coerce')."],
 ["c19",4,"pandas","pandas equivalent of a SQL LEFT JOIN?","a.merge(b, on='key', how='left')."],
 ["c20",4,"pandas","pandas equivalent of GROUP BY with SUM and COUNT?","df.groupby('k').agg(total=('amount','sum'), n=('id','count'))."],
 ["c21",4,"pandas","How do you remove duplicate rows and handle missing values?","df.drop_duplicates(subset=[...]); df.dropna(subset=[...]) or df['c'].fillna(value)."],
 ["c22",4,"ETL","What is ETL vs ELT?","ETL transforms before loading into the target. ELT loads raw data first and transforms inside the warehouse (e.g. with dbt)."],
 ["c23",4,"ETL","What does idempotent mean for a pipeline?","Running it again with the same input gives the same result — no duplicates, no drift."],
 ["c24",5,"ETL","Two ways to make a load idempotent?","Delete-then-insert the partition you're loading, or upsert (INSERT ... ON CONFLICT DO UPDATE)."],
 ["c25",5,"ETL","Name three data-quality checks.","Row count above zero / matches source; key columns not NULL and unique; values within expected ranges."],
 ["c26",5,"ETL","Full load vs incremental load?","Full reloads everything each run. Incremental loads only new/changed rows since the last run (by date or watermark)."],
 ["c27",6,"Modeling","What is the grain of a fact table?","What one row represents (e.g. one taxi trip, one order line). Decide it first."],
 ["c28",6,"Modeling","Fact vs dimension table?","Facts hold measures + foreign keys (amount, qty). Dimensions hold descriptive attributes (date, customer, product)."],
 ["c29",6,"Modeling","Star vs snowflake schema?","Star: denormalized dimensions joined directly to the fact. Snowflake: dimensions normalized into more tables."],
 ["c30",6,"Modeling","SCD Type 1 vs Type 2?","Type 1 overwrites the old value. Type 2 adds a new row with valid_from, valid_to, is_current to keep history."],
 ["c31",6,"Modeling","Why denormalize for analytics?","Fewer joins → simpler, faster read queries. Writes are rare and batch, so duplication is acceptable."],
 ["c32",7,"Spark","How is Spark different from pandas?","Spark distributes data in partitions across many machines and evaluates lazily; pandas is in-memory on one machine and runs immediately."],
 ["c33",7,"Spark","Transformation vs action?","Transformations (filter, select, groupBy) build a plan lazily. Actions (count, show, write) run it."],
 ["c34",7,"Spark","What is a shuffle and why is it slow?","Moving rows between partitions/machines so equal keys meet (groupBy, join). It costs network and disk I/O."],

const KEY = "de-study-hub-v1";
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); const t = new Date(y, m-1, d+n); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const daysBetween = (a, b) => { const p = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); }; return Math.round((p(b)-p(a))/86400000); };
const INTERVALS = [1,3,7,14,30];

function blank() { return { v:1, start: today(), weekOverride: null, tasks:{}, steps:{}, cards:{}, gaps:[], notes:{}, prob:{}, skills:{}, newToday:{date:"",n:0}, updated:0 }; }
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let remoteRef = null, writing = Promise.resolve(), saveTimer = null;
function save() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!remoteRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { state: JSON.stringify(S), updated: S.updated };
    writing = writing.then(() => remoteRef.set(body)).then(() => setSync("Saved to your Claude account")).catch(() => setSync("Saved in this browser only"));
  }, 900);
}
function setSync(t) { document.getElementById("sync").textContent = t; }

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    remoteRef = db.doc("data/users/" + id + "/state");
    const snap = await remoteRef.get();
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.state === "string" && (d.updated || 0) > (S.updated || 0)) {
        S = Object.assign(blank(), JSON.parse(d.state));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        render();
      } else if ((S.updated || 0) > (d && d.updated || 0)) { save(); }
    } else if (S.updated) { save(); }
    setSync("Saved to your Claude account");
  } catch (e) { setSync("Saved in this browser only"); }
})();

/* ---------------- Helpers ---------------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }
function currentWeek() {
  if (S.weekOverride) return S.weekOverride;
  return Math.max(1, Math.min(12, Math.floor(daysBetween(S.start, today()) / 7) + 1));
}
function unlockedCards() { const w = currentWeek(); return CARDS.filter(c => c[1] <= w); }
function dueCards() {
  const t = today(); const out = [];
  let newBudget = S.newToday.date === t ? 15 - S.newToday.n : 15;
  for (const c of unlockedCards()) {
    const st = S.cards[c[0]];
    if (st) { if (st.due <= t) out.push(c); }
    else if (newBudget > 0) { out.push(c); newBudget--; }
  }
  return out;
}
function openGaps() { return S.gaps.filter(g => !g.fixed); }
function gapTopics() {
  const m = {}; for (const g of openGaps()) m[g.topic] = (m[g.topic] || 0) + 1;
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}
function addGap(topic, text) { S.gaps.unshift({ id: "g" + Date.now() + Math.random().toString(36).slice(2,6), date: today(), topic, text, fixed: false }); }
function copyText(txt, btn) {
  const done = () => toast("Copied");
  try { navigator.clipboard.writeText(txt).then(done).catch(() => fallback()); } catch (e) { fallback(); }
  function fallback() { const pre = btn.closest(".copyable").querySelector("pre"); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected — press Ctrl/Cmd+C"); }
}
function updateBadges() {
  const d = dueCards().length, g = openGaps().length;
  const dc = $("#dueCount"), gc = $("#gapCount");
  dc.textContent = d; dc.hidden = d === 0; gc.textContent = g; gc.hidden = g === 0;
}

/* Practice: mixed set */
let practiceSet = null;
function buildSet() {
  const w = currentWeek();
  const pool = PROBLEMS.filter(p => p.week <= w);
  const weak = new Set(gapTopics().map(x => x[0]));
  const scored = pool.map(p => ({ p, s: Math.random() + (weak.has(p.topic) ? 0.6 : 0) + (S.prob[p.id] && S.prob[p.id].result === "miss" ? 0.5 : 0) + (S.prob[p.id] && S.prob[p.id].result === "got" ? -0.4 : 0) }));
  scored.sort((a,b) => b.s - a.s);
  const picked = []; const topicCount = {};
  for (const {p} of scored) { if (picked.length >= 5) break; if ((topicCount[p.topic]||0) >= 2) continue; picked.push(p); topicCount[p.topic] = (topicCount[p.topic]||0)+1; }
  for (let i = picked.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [picked[i],picked[j]] = [picked[j],picked[i]]; }
  practiceSet = picked.map(p => ({ id: p.id, hints: 0, shown: false }));
}
function viewPractice() {
  if (!practiceSet) buildSet();
  const done = Object.values(S.prob).filter(x => x.result).length;
  return `<section class="sheet">

    <div class="callout">Write your attempt first. The answer unlocks after a real attempt or all three hints. SQL runs in <a href="https://www.db-fiddle.com/" target="_blank" rel="noopener">DB Fiddle</a> with the practice database (Tools &amp; data tab); Python runs in <a href="https://colab.research.google.com/" target="_blank" rel="noopener">Colab</a>.</div>

}

/* Flashcards */
let cardQueue = null, cardIdx = 0, cardRevealed = false, cardSession = { got:0, miss:0 };
function viewCards() {
  if (!cardQueue) { cardQueue = dueCards().map(c => c[0]); cardIdx = 0; cardRevealed = false; cardSession = { got:0, miss:0 }; }
  const boxes = [0,0,0,0,0,0];
  for (const c of unlockedCards()) { const st = S.cards[c[0]]; boxes[st ? st.box + 1 : 0]++; }
  const head = `<section class="sheet">
    <h2>Flashcards</h2>
    <p>Cards for weeks 1–${currentWeek()} come back after 1, 3, 7, 14 and 30 days. Up to 15 new cards a day.</p>
    <div class="boxes"><div><b>${boxes[0]}</b>new</div>${INTERVALS.map((d,i) => `<div><b>${boxes[i+1]}</b>${d}-day</div>`).join("")}</div>
  </section>`;
  if (cardIdx >= cardQueue.length) {
    return head + `<section class="card"><div class="front">${cardQueue.length ? "Done for today." : "Nothing due today."}</div>
      <div class="stats"><span><b>${cardSession.got}</b> got it</span><span><b>${cardSession.miss}</b> missed → Gaps</span></div>
      <p class="muted">Come back tomorrow. Missed cards return in 1 day.</p></section>`;
  }
  const c = CARDS.find(x => x[0] === cardQueue[cardIdx]);
  return head + `<section class="card" id="card">
    <div class="stats"><span>Card <b>${cardIdx+1}</b> / ${cardQueue.length}</span><span class="chip">${esc(c[2])}</span></div>
    <div class="front">${esc(c[3])}</div>
    <textarea id="card-attempt" placeholder="Type your answer from memory first…"></textarea>
    ${cardRevealed ? `<div class="back"><p class="eyebrow">Answer</p><p>${esc(c[4])}</p>
      <div class="row"><button class="btn good" data-act="card-got">I got it</button><button class="btn bad" data-act="card-miss">I missed it</button></div></div>`
      : `<div class="row"><button class="btn primary" data-act="card-show" id="card-show" disabled>Show answer</button><span class="muted" style="font-size:13px">Type something first — guessing counts.</span></div>`}
  </section>`;
}
function bindCards() {
  const ta = $("#card-attempt"), btn = $("#card-show");
  if (ta) { if (bindCards.lastAttempt) ta.value = bindCards.lastAttempt; ta.addEventListener("input", () => { bindCards.lastAttempt = ta.value; if (btn) btn.disabled = ta.value.trim().length < 2; }); if (btn) btn.disabled = ta.value.trim().length < 2; if (!cardRevealed) ta.focus({ preventScroll: true }); }
}
function gradeCard(ok) {
  const c = CARDS.find(x => x[0] === cardQueue[cardIdx]); const t = today();
  const st = S.cards[c[0]];
  if (!st) { if (S.newToday.date !== t) S.newToday = { date: t, n: 0 }; S.newToday.n++; }
  let box = st ? st.box : -1;
  if (ok) { box = Math.min(box + 1, 4); cardSession.got++; }
  else { box = 0; cardSession.miss++; addGap(c[2], "Flashcard: " + c[3]); }
  S.cards[c[0]] = { box, due: addDays(t, INTERVALS[box]), last: ok ? "got" : "miss" };
  cardIdx++; cardRevealed = false; bindCards.lastAttempt = "";
  save(); render();
}

function viewGaps() {
  const tops = gapTopics(); const max = tops.length ? tops[0][1] : 1;
  const open = openGaps(), fixed = S.gaps.filter(g => g.fixed);
  return `<section class="sheet">
    <h2>Gaps</h2>
    <p>Every miss lands here. Weakest topics come first in practice sets and today's warm-up. Mark a gap fixed once you can answer it from memory on a later day.</p>
    ${tops.length ? `<div class="topicbars">${tops.map(([k,c]) => `<div><span>${esc(k)}</span><span class="b" style="width:${Math.max(6, c/max*100)}%"></span><em>${c}</em></div>`).join("")}</div>` : ""}
    <div class="row">
      <select id="gap-topic" aria-label="Gap topic">${TOPICS.map(x => `<option>${esc(x)}</option>`).join("")}</select>
      <input type="text" id="gap-text" placeholder="What I got wrong or couldn't explain" style="flex:1;min-width:180px">
      <button class="btn primary" data-act="add-gap">Add</button>
    </div>
  </section>
  <section class="sheet">
    <h2>Open (${open.length})</h2>
    ${open.length ? open.map(g => gapRow(g)).join("") : `<p class="muted">No open gaps. Misses from flashcards and practice will show up here.</p>`}
    ${fixed.length ? `<h3>Fixed (${fixed.length})</h3>${fixed.slice(0,30).map(g => gapRow(g)).join("")}` : ""}
  </section>`;
}
function gapRow(g) {
  return `<div class="gap ${g.fixed?"fixed":""}"><div class="gt"><span class="chip ${g.fixed?"good":"bad"}">${esc(g.topic)}</span> <span class="muted" style="font-family:var(--mono);font-size:12px">${esc(g.date)}</span><br>${esc(g.text)}</div>
    <div class="row"><button class="btn" data-act="toggle-gap" data-gid="${esc(g.id)}">${g.fixed?"Reopen":"Fixed"}</button><button class="btn" data-act="del-gap" data-gid="${esc(g.id)}" aria-label="Remove gap">Remove</button></div></div>`;
}

const LEVELS = ["Not started","Learning","Can explain","Interview-ready"];
function viewSkills() {
  const w = currentWeek();
  return `<section class="sheet">
    <h2>Resume check</h2>
    <p>Set your honest level for each skill. Only claim a skill in interviews once it's at <b>Can explain</b> or higher.</p>
    <div class="scroll"><table class="skilltbl"><thead><tr><th>Skill</th><th>Planned</th><th>Your level</th><th>Safe to claim?</th></tr></thead><tbody>
    ${SKILLS.map(([name, wk, topic], i) => { const lvl = S.skills[i] || 0; const gaps = topic ? openGaps().filter(g => g.topic === topic).length : 0; const safe = lvl >= 2;
      return `<tr><td>${esc(name)}${gaps ? `<br><span class="chip bad">${gaps} open gap${gaps>1?"s":""}</span>` : ""}</td><td style="font-family:var(--mono);font-size:13px">wk ${wk}${wk<=w?"":" (later)"}</td>
      <td><select id="skill-${i}" data-skill="${i}" aria-label="Level for ${esc(name)}">${LEVELS.map((l,k) => `<option value="${k}" ${k===lvl?"selected":""}>${l}</option>`).join("")}</select></td>
      <td>${safe ? `<span class="chip good">Yes</span>` : `<span class="chip bad">Not yet</span>`}</td></tr>`; }).join("")}
    </tbody></table></div>
  </section>`;
}

function viewSetup() {
  return `<section class="sheet">
    <h2>Nothing to install to start</h2>
    <ul>
      <li><b>SQL:</b> open <a href="https://www.db-fiddle.com/" target="_blank" rel="noopener">DB Fiddle</a>, pick PostgreSQL, paste the practice database below into the left panel, write queries on the right.</li>
      <li><b>Python / pandas / PySpark:</b> <a href="https://colab.research.google.com/" target="_blank" rel="noopener">Google Colab</a> — free notebooks in the browser. <code>!pip install pyspark</code> works there.</li>
      <li><b>Courses:</b> <a href="https://www.kaggle.com/learn" target="_blank" rel="noopener">Kaggle Learn</a> (Python, Pandas, Data Cleaning) and the <a href="https://github.com/DataTalksClub/data-engineering-zoomcamp" target="_blank" rel="noopener">Data Engineering Zoomcamp</a> are free.</li>
      <li><b>From week 5:</b> install PostgreSQL, Docker Desktop and Git on your computer, and make a GitHub account.</li>
    </ul>
  </section>
  <section class="sheet copyable">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Practice database (PostgreSQL)</h2><button class="btn" data-act="copy" data-src="sql">Copy</button></div>
    <p class="muted" style="margin-top:6px">Tables: departments, employees, customers, orders. Used by the SQL practice problems.</p>
    <pre>${esc(SETUP_SQL)}</pre>
  </section>
  <section class="sheet copyable">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Messy CSV for pandas</h2><button class="btn" data-act="copy" data-src="csv">Copy</button></div>
    <p class="muted" style="margin-top:6px">In Colab: <code>raw = """</code>paste<code>"""</code>, then <code>pd.read_csv(StringIO(raw))</code>. It has duplicates, mixed dates, text amounts and messy city names on purpose.</p>
    <pre>${esc(MESSY_CSV)}</pre>
  </section>
  <section class="sheet">
    <h2>Using this with Claude Code</h2>
    <p>The <code>CLAUDE.md</code> in <code>~/Projects/data-eng-study</code> tells Claude Code to coach you the same way. Use this page for the daily routine; use Claude Code when you want it to review your code, quiz you, or play interviewer.</p>
  </section>`;
}

/* ---------------- Events ---------------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo({ top: 0 });
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.step) { const t = today(); S.steps[t] = Object.assign({}, S.steps[t], { [el.dataset.step]: el.checked }); save(); render(); }
  else if (el.dataset.task) { S.tasks[el.dataset.task] = el.checked; save(); render(); }
  else if (el.dataset.skill) { S.skills[el.dataset.skill] = +el.value; save(); render(); }
  else if (el.id === "start-date" && el.value) { S.start = el.value; save(); render(); }
  else if (el.id === "week-ov") { S.weekOverride = el.value ? +el.value : null; practiceSet = null; cardQueue = null; save(); render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.note) { const t = today(); S.notes[t] = Object.assign({}, S.notes[t], { [el.dataset.note]: el.value }); save(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "hint" || act === "show" || act === "got" || act === "miss") {
    const box = b.closest(".prob"), ps = practiceSet[+box.dataset.idx], p = PROBLEMS.find(x => x.id === ps.id);
    if (act === "hint") ps.hints = Math.min(3, ps.hints + 1);
    if (act === "show") ps.shown = true;
    if (act === "got" || act === "miss") {
      S.prob[p.id] = Object.assign({}, S.prob[p.id], { result: act, date: today() });
      if (act === "miss") { addGap(p.topic, "Practice: " + p.q.slice(0, 140)); toast("Added to Gaps"); } else toast("Logged");
      save();
    }
    render(); const again = document.querySelector(`.prob[data-pid="${p.id}"]`); if (again && act !== "got" && act !== "miss") again.scrollIntoView({ block: "nearest" });
  }
  else if (act === "newset") { buildSet(); render(); }
  else if (act === "card-show") { cardRevealed = true; render(); }
  else if (act === "card-got") gradeCard(true);
  else if (act === "card-miss") gradeCard(false);
  else if (act === "add-gap" || act === "quick-gap") {
    const pre = act === "add-gap" ? "gap" : "quick-gap";
    const txt = $("#" + pre + "-text").value.trim(); if (!txt) { toast("Write what you missed first"); return; }
    addGap($("#" + pre + "-topic").value, txt); save(); toast("Added to Gaps");
    if (act === "add-gap") render(); else { $("#quick-gap-text").value = ""; updateBadges(); }
  }
  else if (act === "toggle-gap") { const g = S.gaps.find(x => x.id === b.dataset.gid); if (g) { g.fixed = !g.fixed; save(); render(); } }
  else if (act === "del-gap") { S.gaps = S.gaps.filter(x => x.id !== b.dataset.gid); save(); render(); }
  else if (act === "copy") copyText(b.dataset.src === "sql" ? SETUP_SQL : MESSY_CSV, b);
});

render();
</script>
