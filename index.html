<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DE Study">
<title>Data Engineering: Zero to Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a study notebook on schema-grid paper. Sticky tab bar, one reading column (~72ch). */
:root {
  --paper: #f3f5f8; --sheet: #ffffff; --ink: #18202e; --muted: #5a6577; --rule: #d9dee7;
  --accent: #2348c7; --accent-ink: #ffffff; --accent-soft: #e4eafb;
  --mark: #f2b13a; --mark-soft: #fdf1d8;
  --good: #1d7a4c; --good-soft: #def2e7; --bad: #b3372c; --bad-soft: #f8e1de;
  --code-bg: #eef1f6; --grid: #e3e7ee;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --sheet: #171c27; --ink: #e5e9f1; --muted: #98a2b5; --rule: #2a3242;
    --accent: #8ea6ff; --accent-ink: #0d1424; --accent-soft: #1f2a4d; --mark: #f2b13a; --mark-soft: #3a2e14;
    --good: #5fd39a; --good-soft: #15352a; --bad: #ff8a7d; --bad-soft: #3d1d1a; --code-bg: #0e121a; --grid: #1a2030;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --sheet: #171c27; --ink: #e5e9f1; --muted: #98a2b5; --rule: #2a3242;
  --accent: #8ea6ff; --accent-ink: #0d1424; --accent-soft: #1f2a4d; --mark: #f2b13a; --mark-soft: #3a2e14;
  --good: #5fd39a; --good-soft: #15352a; --bad: #ff8a7d; --bad-soft: #3d1d1a; --code-bg: #0e121a; --grid: #1a2030;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
.wrap { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
header.top { padding-block: 26px 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
.brand .q { display: block; color: var(--accent); font-family: var(--mono); font-weight: 500; font-size: 0.5em; letter-spacing: 0; margin-bottom: 6px; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; gap: 2px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; margin-inline: -16px; padding-inline: 12px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { font: 500 14px var(--body); color: var(--muted); background: transparent; border: 0; padding: 8px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--sheet); box-shadow: inset 0 -2px 0 var(--accent); }
.count { font-family: var(--mono); font-size: 11px; background: var(--mark); color: #2a1d00; border-radius: 9px; padding: 1px 6px; margin-left: 4px; }
main { display: grid; gap: 18px; padding-top: 18px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; min-width: 0; }
.hero { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 28px 24px; }
h1, h2, h3, h4 { text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; margin: 0 0 10px; }
h2.big { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.02rem; margin: 18px 0 6px; }
h4 { font-size: 1rem; margin: 20px 0 6px; }
.ltitle { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.1; margin: 4px 0 6px; letter-spacing: -0.01em; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
p { margin: 0 0 10px; }
.lead { font-size: 1.06rem; font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.mono { font-family: var(--mono); font-size: 13px; }
.goodtxt { color: var(--good); } .badtxt { color: var(--bad); }
ul, ol { margin: 0 0 10px; padding-left: 22px; }
li { margin-bottom: 4px; }
a { color: var(--accent); text-underline-offset: 2px; }
code, pre, textarea.code { font-family: var(--mono); font-size: 13.5px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 8px 0 12px; line-height: 1.5; white-space: pre; }
pre.flow { color: var(--accent); }
table.mini { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; display: block; overflow-x: auto; }
table.mini th, table.mini td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.mini th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
.analogy { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
.callout { border-left: 3px solid var(--mark); background: var(--mark-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; }
.btn { font: 500 14px var(--body); border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); min-height: 38px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.big { font-size: 16px; padding: 12px 20px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 180px; }
textarea, input[type="text"], input[type="date"], select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; padding: 10px 12px; }
input[type="date"], select { width: auto; }
input.grow { width: auto; }
textarea { resize: vertical; display: block; margin-top: 8px; }
textarea.code { line-height: 1.5; tab-size: 4; white-space: pre; overflow-x: auto; }
textarea.prose { font-family: var(--body); font-size: 15px; white-space: pre-wrap; }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin: 0; }
.chip.mark { background: var(--mark-soft); color: var(--ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.steps li:last-child { border-bottom: 0; }
.steps input[type="checkbox"] { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
.steps .t { font-weight: 600; }
.steps .d { color: var(--muted); font-size: 14px; }
.steps li.done .t { text-decoration: line-through; color: var(--muted); }
.phasegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.phase { text-align: left; display: grid; gap: 4px; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 12px; cursor: pointer; color: var(--ink); font: inherit; }
.phase:hover { border-color: var(--accent); }
.bar { display: block; width: 100%; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.phase-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
ol.lessons { list-style: none; padding: 0; margin: 4px 0 0; }
ol.lessons li { margin: 0; border-top: 1px solid var(--rule); }
ol.lessons button { width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; text-align: left; background: none; border: 0; padding: 11px 2px; cursor: pointer; color: var(--ink); font: inherit; }
ol.lessons button .small { grid-column: 2; }
ol.lessons .dot { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: 12px; margin-top: 1px; }
ol.lessons li.done .dot { background: var(--good); border-color: var(--good); color: var(--sheet); }
ol.lessons li.next .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
ol.lessons li.next .lt { font-weight: 600; }
ol.lessons button:hover .lt { color: var(--accent); }
.lesson { display: grid; gap: 18px; }
.crumbs { color: var(--muted); }
.step.body > p, .step.body > ul, .step.body > ol { max-width: 70ch; }
.ex { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 16px; min-width: 0; }
.ex:first-of-type { border-top: 0; padding-top: 0; margin-top: 8px; }
.ex-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.ex-head .eyebrow { margin: 0; }
.ex-q { font-weight: 500; margin-top: 6px; }
.hint { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 8px; }
.verdict { border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 10px; font-weight: 500; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.out { margin-top: 10px; min-width: 0; }
.out pre { margin: 4px 0; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.err pre { background: transparent; padding: 0; margin: 4px 0 0; color: inherit; white-space: pre-wrap; }
.answer { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; min-width: 0; }
.answer pre { background: var(--sheet); white-space: pre-wrap; }
.scroll { overflow-x: auto; }
table.result { border-collapse: collapse; font-family: var(--mono); font-size: 13px; margin-top: 4px; }
table.result th, table.result td { border: 1px solid var(--rule); padding: 4px 9px; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.result th { background: var(--code-bg); font-weight: 500; }
.null { color: var(--muted); font-style: italic; }
.loading::after { content: ""; display: inline-block; width: 1em; animation: dots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }
.quiz { border-top: 1px solid var(--rule); padding: 12px 0; display: grid; gap: 6px; }
.quiz:first-of-type { border-top: 0; }
.quiz .qf { font-weight: 500; }
.quiz .row { margin-top: 0; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 22px; display: grid; gap: 12px; }
.card .front { font-size: 1.15rem; font-weight: 500; }
.card .back { border-top: 1px dashed var(--rule); padding-top: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
.stats b { color: var(--ink); font-size: 1.1rem; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.boxes div { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.boxes div b { display: block; font-size: 1.1rem; color: var(--ink); }
.gap { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.gap .row { margin-top: 0; }
.gap.fixed .gt { text-decoration: line-through; color: var(--muted); }
.gt { min-width: 0; overflow-wrap: anywhere; }
.topicbars { display: grid; gap: 6px; margin: 8px 0 14px; }
.topicbars div { display: grid; grid-template-columns: 120px 1fr 28px; gap: 10px; align-items: center; font-size: 14px; }
.topicbars span.b { height: 8px; background: var(--bad); border-radius: 4px; opacity: 0.75; }
.topicbars em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.skilltbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.skilltbl th, .skilltbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.skilltbl th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.res { list-style: none; padding: 0; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.sync { font: 500 12px var(--mono); border: 1px solid var(--rule); background: var(--sheet); color: var(--muted); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
.sync[data-state="synced"] { color: var(--good); border-color: var(--good); }
.sync[data-state="error"], .sync[data-state="conflict"] { color: var(--bad); border-color: var(--bad); }
.sync[data-state="signed-out"] { color: var(--accent); border-color: var(--accent); }
.authform { display: grid; gap: 6px; max-width: 420px; }
.authform label { font-size: 14px; font-weight: 500; margin-top: 6px; }
input[type="email"], input[type="password"] { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; padding: 10px 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
@media (max-width: 560px) {
  .sheet, .hero { padding: 16px; }
  .gap { grid-template-columns: 1fr; }
  .topicbars div { grid-template-columns: 90px 1fr 24px; }
  .steps li { grid-template-columns: 26px 1fr; }
  .steps li > div:last-child { grid-column: 2; }
  .boxes div { padding: 6px 2px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .loading::after { animation: none; width: 1.2em; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand"><span class="q">SELECT you FROM learners WHERE level = 'zero';</span>Data Engineering: Zero to Pro</h1>
    <button class="sync" id="sync-status" data-go="progress" hidden></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="today" aria-selected="true">Today</button>
    <button data-tab="path" aria-selected="false">Course</button>
    <button data-tab="review" aria-selected="false">Review<span class="count" id="dueCount" hidden>0</span></button>
    <button data-tab="practice" aria-selected="false">Practice</button>
    <button data-tab="gaps" aria-selected="false">Gaps<span class="count" id="gapCount" hidden>0</span></button>
    <button data-tab="progress" aria-selected="false">Progress</button>
    <button data-tab="play" aria-selected="false">Playground</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="content.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
